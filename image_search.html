<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Image Search</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="top-right-links">
            <a href="index.html"><button type="button" class="btn btn-outline-secondary">Search</button></a>
            <a href="advanced_search.html"><button type="button" class="btn btn-outline-secondary">Advanced Search</button></a>
        </div>
        <div class="main">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="text-center bottom-space">
                        <span id="g1">G</span><span id="o1">o</span><span id="o2">o</span><span id="g2">g</span><span id="l">l</span><span id="e">e</span><span class="small">images</span>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <form action="https://images.google.com/search">
                        <input type="hidden" name="tbm" value="isch">
                        <div class="text-center">
                            <input type="text" name="q">
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-outline-secondary button">Google Search</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
