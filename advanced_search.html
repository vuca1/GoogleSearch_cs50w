<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="top-right-links">
            <a href="index.html"><button type="button" class="btn btn-outline-secondary">Search</button></a>
            <a href="image_search.html"><button type="button" class="btn btn-outline-secondary">Image Search</button></a>
        </div>

        <div class="main main2">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="text-center bottom-space">
                        <span id="g1">G</span><span id="o1">o</span><span id="o2">o</span><span id="g2">g</span><span id="l">l</span><span id="e">e</span><span class="small">advanced</span>
                    </div>
                </div>

                <form action="https://google.com/search">
                    <div class="row mb-3">
                        <div class="col-3 text-right">
                            <label for="allTheseWords">all these words: </label>
                        </div>
                        <div class="col-9">
                            <input type="text" id="allTheseWords" name="as_q">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-3 text-right">
                            <label for="thisExactWordOrPhrase">this exact word or phrase: </label>
                        </div>
                        <div class="col-9">
                            <input type="text" id="thisExactWordOrPhrase" name="as_epq">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-3 text-right">
                            <label for="anyOfTheseWords">any of these words: </label>
                        </div>
                        <div class="col-9">
                            <input type="text" id="anyOfTheseWords" name="as_oq">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-3 text-right">
                            <label for="noneOfTheseWords">none of these words: </label>
                        </div>
                        <div class="col-9">
                            <input type="text" id="noneOfTheseWords" name="as_eq">
                        </div>
                    </div>

                    <div class="row text-center mb-3">
                        <div class="col-12 text-center">
                            <button type="submit" class="btn btn-primary button">Advanced Search</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
